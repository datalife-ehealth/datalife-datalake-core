[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalife-datalake-core"
version = "0.1.0"
description = "DataLife e-Health data lake core: dual-tier storage, OTP access, and a Merkle audit ledger"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Luchang Jiang", email = "auroral.sunflower@gmail.com" }]
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "httpx>=0.27.0"]
performance = ["pytest-benchmark>=4.0.0"]
postgres = ["psycopg[binary]>=3.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "performance: marks tests as performance benchmarks (skipped by default)",
]
addopts = "-m 'not performance'"
